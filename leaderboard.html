<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Memory Beat — טבלת תוצאות</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<main class="app">
  <div class="card">

    <section class="screen screen--leaderboard">
      <h2 class="screen-title"><span>טבלת תוצאות</span><span aria-hidden="true">🏆</span></h2>

      <div class="table" id="leaderboard-table">
        <div class="table__row table__row--head">
          <div class="table__cell">שם</div>
          <div class="table__cell">
            <button class="table__sort-button" id="btn-filter-difficulty" type="button" aria-label="סינון לפי רמת הקושי" aria-pressed="false">
              רמת קושי
            </button>
          </div>
          <div class="table__cell">
            <button class="table__sort-button" id="btn-filter-duration" type="button" aria-label="סינון לפי זמן המשחק" aria-pressed="false">
              זמן המשחק
            </button>
          </div>
          <div class="table__cell">שלב</div>
          <div class="table__cell">ניקוד</div>
        </div>
        <!-- rows are rendered by js/leaderboard.js from placeholder data -->
      </div>

      <a class="btn btn--dark btn--back" href="index.html">חזרה</a>
    </section>

  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/storage.js"></script>
<script src="js/leaderboard.js"></script>
</body>
</html>
